name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, feat/hatch-mobile-api]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # The Dockerfile's Deno stage is the single source of the Deno version.
      - name: Read Deno version from Dockerfile
        id: deno
        run: |
          version="$(sed -nE 's#^FROM denoland/deno:bin-([^ ]+) AS deno$#\1#p' Dockerfile)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno.outputs.version }}

      # The Dockerfile's NSH stage pins the version and SHA-256 of the CLI and
      # its web runtime; native App build tests run with the same release.
      - name: Install NSH from the Dockerfile pin
        run: |
          arg() { sed -nE "s#^ARG $1=(.+)\$#\\1#p" Dockerfile; }
          version="$(arg NSH_VERSION)"
          base="https://github.com/longbridge/nsh/releases/download/v${version}"
          curl -fsSL -o /tmp/nsh.tar.gz "$base/nsh-linux-x86_64.tar.gz"
          echo "$(arg NSH_LINUX_X86_64_SHA256)  /tmp/nsh.tar.gz" | sha256sum -c -
          curl -fsSL -o /tmp/nsh-web.tar.gz "$base/nsh-web.tar.gz"
          echo "$(arg NSH_WEB_SHA256)  /tmp/nsh-web.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nsh.tar.gz -C /opt
          sudo tar -xzf /tmp/nsh-web.tar.gz -C /opt
          sudo mkdir -p /opt/nsh/components
          printf '{"version":"%s","commit":"%s"}' "$version" "$(arg NSH_COMMIT)" | sudo tee /opt/nsh/components/web.json
          echo "HATCH_NSH_BIN=/opt/nsh/bin/nsh" >> "$GITHUB_ENV"

      # The Dockerfile's nshpkg stage pins the Rust release; native package
      # tests sign and verify with the tool built the same way.
      - name: Read Rust version from Dockerfile
        id: rust
        run: |
          version="$(sed -nE 's#^FROM rust:([0-9.]+)-slim-trixie AS nshpkg$#\1#p' Dockerfile)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Build the package signing tool
        run: |
          cargo build --locked --release --manifest-path packages/hatch-nshpkg/Cargo.toml
          echo "HATCH_NSHPKG_BIN=$PWD/packages/hatch-nshpkg/target/release/hatch-nshpkg" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Platform API contract
        run: pnpm platform-api:check

      # Fails when a key is added without translations; see AGENTS.md.
      - name: Check translations
        run: pnpm i18n:check

      - name: Run type check
        run: pnpm check:types

      - name: Run linter
        run: pnpm lint

      - name: Export mobile iOS bundle
        run: pnpm mobile:export:ios
        env:
          EXPO_NO_TELEMETRY: 1

      # The passkey integration test drives a real browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test:unit
        env:
          DATA_TABLE_TEST_DATABASE_URL: postgres://postgres@localhost:5432/hatch_test
          HATCH_AUTH_TEST_DATABASE_URL: postgres://postgres@localhost:5432/hatch_test
          HATCH_POSTGRES_TEST_DATABASE_URL: postgres://postgres@localhost:5432/hatch_test

      - name: Build
        run: pnpm build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm hatch-sdk:build && pnpm test:browser

  tailscale:
    name: Tailscale connection helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/tailscale/go.mod
          cache-dependency-path: packages/tailscale/go.sum
      - name: Check proxy boundaries and build helper
        working-directory: packages/tailscale
        run: |
          go test ./...
          CGO_ENABLED=0 go build -trimpath .

  mobile-native:
    name: Mobile native runtime core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The core of the phone runtimes (mobile/native): the host bridge, the
      # platform client and the run rules, without NSH. The engine tests
      # need the iOS Simulator or an Android device: scripts/test-ios.sh and
      # scripts/test-android.sh run them locally.
      - name: Swift core
        working-directory: mobile/native/ios/HatchAppCore
        run: swift test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Kotlin core
        working-directory: mobile/native/android
        run: ./gradlew --no-daemon :hatch-app-core:test

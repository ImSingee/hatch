[package]
name = "hatch-desktop"
version = "0.1.0"
description = "Hatch for macOS"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "hatch_desktop"
crate-type = ["rlib"]

[features]
# Developer probes for the native-view (B1) and webview passkey (B2)
# assumptions. Never enabled in a distributed build.
probes = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["time", "sync"] }
url = "2"
percent-encoding = "2"
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

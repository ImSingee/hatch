syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";
import "hatch/platform/v1/model.proto";

// AI providers: the endpoints and keys the Agent and image generation call.
// API keys are write-only; responses only say whether a provider has one.
service ProviderService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse);
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // Sends one short prompt through the provider and reports the outcome.
  rpc TestProvider(TestProviderRequest) returns (TestProviderResponse);
  // The models the provider itself lists (GET …/models).
  rpc ListRemoteModels(ListRemoteModelsRequest) returns (ListRemoteModelsResponse);
  // Sets the provider order Settings, the model picker and the first-model
  // fallback follow.
  rpc ReorderProviders(ReorderProvidersRequest) returns (ReorderProvidersResponse);
}

message Provider {
  string id = 1;
  string name = 2;
  // "anthropic-messages", "openai-responses" or "openai-completions".
  string api_type = 3;
  string base_url = 4;
  bool enabled = 5;
  // Built-in catalog provider it is linked to; unset when unlinked.
  optional string catalog_provider_id = 6;
  bool has_api_key = 7;
  bool can_generate_images = 8;
  // Model order.
  repeated ProviderModel models = 9;
}

message ListProvidersRequest {
  // The next_cursor of the previous page.
  optional string cursor = 1 [(buf.validate.field).string.pattern = "^[0-9]{1,9}$"];
  // Entries per page; 0 returns every one.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 100];
}

message ListProvidersResponse {
  // Display order.
  repeated Provider providers = 1;
  // Set when more providers follow this page.
  optional string next_cursor = 2;
}

message GetProviderRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message GetProviderResponse {
  Provider provider = 1;
}

message NewProviderModel {
  string model_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // "chat" (default) or "image".
  optional string kind = 2 [(buf.validate.field).string = {
    in: [
      "chat",
      "image"
    ]
  }];
}

message CreateProviderRequest {
  // Start from this catalog provider: it supplies the name, API type, base
  // URL and recommended models unless they are given.
  optional string catalog_provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // Required without catalog_provider_id.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  // Required without catalog_provider_id.
  optional string api_type = 3 [(buf.validate.field).string = {
    in: [
      "anthropic-messages",
      "openai-responses",
      "openai-completions"
    ]
  }];
  // Required without catalog_provider_id.
  optional string base_url = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string api_key = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  // Models to add. Ignored when no_models is set; when empty, the catalog
  // provider's recommended models are added.
  repeated NewProviderModel models = 6 [(buf.validate.field).repeated.max_items = 100];
  // Add no models, not even the recommended ones.
  bool no_models = 7;
}

message CreateProviderResponse {
  Provider provider = 1;
}

// Unset fields stay unchanged.
message UpdateProviderRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  optional string api_type = 3 [(buf.validate.field).string = {
    in: [
      "anthropic-messages",
      "openai-responses",
      "openai-completions"
    ]
  }];
  optional string base_url = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // Replaces the API key.
  optional string api_key = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  optional bool enabled = 6;
  // Links the provider to this catalog provider.
  optional string catalog_provider_id = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  // Unlinks the provider from the catalog. Excludes catalog_provider_id.
  bool clear_catalog_provider = 8;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

message DeleteProviderRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message DeleteProviderResponse {}

message TestProviderRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  // Chat model id to ask; the provider's first enabled chat model when unset.
  optional string model_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

message TestProviderResponse {
  bool ok = 1;
  string model_id = 2;
  uint32 latency_ms = 3;
  // The provider's error, without the key. Unset when ok.
  optional string error = 4;
}

message ListRemoteModelsRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  // The next_cursor of the previous page.
  optional string cursor = 2 [(buf.validate.field).string.pattern = "^[0-9]{1,9}$"];
  // Entries per page; 0 returns every one.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 100];
}

message RemoteModel {
  string model_id = 1;
  optional string name = 2;
  // Catalog entry with the same id under the provider's catalog link.
  optional string catalog_ref = 3;
  // True when the provider already has a model with this id.
  bool added = 4;
}

message ListRemoteModelsResponse {
  // Sorted by model id.
  repeated RemoteModel models = 1;
  // Set when more models follow this page.
  optional string next_cursor = 2;
  // True when the provider listed more than the platform reads (2,000).
  bool truncated = 3;
}

message ReorderProvidersRequest {
  // Provider ids in their new order. Providers that are not listed keep
  // their relative order after the listed ones.
  repeated string provider_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 200
      }
    }
  }];
}

message ReorderProvidersResponse {
  // Every provider id in its new order.
  repeated string provider_ids = 1;
}

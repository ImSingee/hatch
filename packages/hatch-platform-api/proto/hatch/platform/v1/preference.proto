syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

// Personal preferences of the calling user. A Run credential acts for the
// user who sent the prompt its run answers.
service PreferenceService {
  rpc GetAgentPreferences(GetAgentPreferencesRequest) returns (GetAgentPreferencesResponse);
  rpc UpdateAgentPreferences(UpdateAgentPreferencesRequest) returns (UpdateAgentPreferencesResponse);
}

message AgentPreferences {
  // How a message sent while the Agent is working is delivered: "queue"
  // waits for the run to finish and starts its own run; "steer" is injected
  // into the running run after its current tool calls finish.
  string message_mode = 1;
  // The model new chats start with, as saved; it may name a model removed
  // since. Unset uses the first available model.
  optional DefaultAgentModel default_model = 2;
}

message DefaultAgentModel {
  string provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  string model_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Unset uses the model's default level.
  optional string thinking_level = 3 [(buf.validate.field).string = {
    in: [
      "off",
      "minimal",
      "low",
      "medium",
      "high",
      "xhigh",
      "max"
    ]
  }];
}

message GetAgentPreferencesRequest {}

message GetAgentPreferencesResponse {
  AgentPreferences preferences = 1;
}

message UpdateAgentPreferencesRequest {
  // Unset leaves the mode unchanged.
  optional string message_mode = 1 [(buf.validate.field).string = {
    in: [
      "queue",
      "steer"
    ]
  }];
  // Replaces the default model.
  optional DefaultAgentModel default_model = 2;
  // Clears the default model. Excludes default_model.
  bool clear_default_model = 3;
}

message UpdateAgentPreferencesResponse {
  AgentPreferences preferences = 1;
}

syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

// The instance-wide look that the web, mobile and desktop clients apply.
service ThemeService {
  rpc GetTheme(GetThemeRequest) returns (GetThemeResponse);
  rpc SetTheme(SetThemeRequest) returns (SetThemeResponse);
}

// One accent the instance can choose.
message Accent {
  string name = 1;
  // Base colour as #RRGGBB.
  string color = 2;
}

message ThemeState {
  // Name of the chosen accent.
  string accent = 1;
  // The accent used while none has been chosen.
  string default_accent = 2;
  // Every accent that SetTheme accepts.
  repeated Accent accents = 3;
  // Whether the web dock shows each tile's name under it. Off by default;
  // the full name always shows on hover.
  bool dock_labels = 4;
}

message GetThemeRequest {}

message GetThemeResponse {
  ThemeState theme = 1;
}

// Changes the fields it sets and keeps the others; set at least one.
message SetThemeRequest {
  // One of the names in ThemeState.accents; the platform checks membership.
  optional string accent = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[a-z][a-z0-9-]*$"
  }];
  // Whether the web dock shows each tile's name under it.
  optional bool dock_labels = 2;
}

message SetThemeResponse {
  ThemeState theme = 1;
}

syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// Interactive resources require a Better Auth user session, never API keys or Run JWTs.
service AgentService {
  rpc GetModelCatalog(GetModelCatalogRequest) returns (GetModelCatalogResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
}

message GetModelCatalogRequest {}
message GetModelCatalogResponse {
  repeated AgentProvider providers = 1;
  AgentModelSelection default_model = 2;
}
message AgentProvider {
  string id = 1;
  string name = 2;
  repeated AgentModel models = 3;
}
message AgentModel {
  string id = 1;
  string model_id = 2;
  string name = 3;
  bool reasoning = 4;
  double context_window = 5;
  double max_tokens = 6;
}
message AgentModelSelection {
  string provider_id = 1;
  string model_id = 2;
}
message ListSessionsRequest {
  optional string app_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}
message ListSessionsResponse {
  repeated AgentSessionSummary sessions = 1;
}
message AgentSessionSummary {
  string id = 1;
  string title = 2;
  repeated string app_ids = 3;
  optional string provider_id = 4;
  optional string model_id = 5;
  uint32 message_count = 6;
  string updated_at = 7;
}
message CreateSessionRequest {
  optional string title = 1 [(buf.validate.field).string.max_len = 200];
  optional string provider_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  optional string model_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}
message CreateSessionResponse {
  string id = 1;
}
message GetSessionRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}
message GetSessionResponse {
  AgentSession session = 1;
}
message AgentSession {
  string id = 1;
  string title = 2;
  repeated string app_ids = 3;
  optional string provider_id = 4;
  optional string model_id = 5;
  // Revision guard for Retry; all transcript/run fields share a repeatable-read snapshot.
  string updated_at = 6;
  // Persisted Agent message union retains its existing JSON content and numeric semantics.
  repeated google.protobuf.Value messages = 7;
  ActiveAgentRun active_run = 8;
  repeated AgentRunTiming runs = 9;
  string server_time = 10;
  // Present when the latest run failed and its turn can be replayed.
  AgentRetryState retry = 11;
  // The Agent Runner whose workspace holds this chat; unset until a run of
  // the chat has been accepted by a runner.
  optional string runner_id = 12;
  // Messages sent while a run was working that are not delivered yet.
  AgentPendingMessages pending = 13;
}
message AgentPendingMessages {
  // Delivery stopped after the user stopped a run or a run failed for good.
  bool paused = 1;
  // In send order.
  repeated AgentPendingMessage messages = 2;
}
message AgentPendingMessage {
  string id = 1;
  // "queue" or "steer".
  string mode = 2;
  // "pending" (editable), "claimed" (being injected) or "sending" (Send now).
  string status = 3;
  // Composer input parts with their existing JSON shape.
  repeated google.protobuf.Value content = 4;
  // Display text; resource mentions read as @name.
  string text = 5;
  repeated AgentPendingImage images = 6;
  repeated AgentPendingAttachment attachments = 7;
  string provider_id = 8;
  string model_id = 9;
  string created_at = 10;
  string updated_at = 11;
}
message AgentPendingImage {
  // Base64 image data.
  string data = 1;
  string mime_type = 2;
}
message AgentPendingAttachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  double size = 4;
}
message ActiveAgentRun {
  string id = 1;
  string status = 2;
  string started_at = 3;
  optional int32 user_turn = 4;
  AgentPendingAsk pending_ask = 5;
  optional string answered_ask_id = 6;
  AgentPendingEnvironment pending_env_request = 7;
}
message AgentRunTiming {
  string id = 1;
  string status = 2;
  int32 user_turn = 3;
  string started_at = 4;
  optional string completed_at = 5;
  optional string error = 6;
}
message AgentRetryState {
  // Failed run whose turn a retry replays.
  string run_id = 1;
  int32 user_turn = 2;
  // Consecutive failed runs in the session; a completed run resets it.
  int32 attempt = 3;
  int32 max_attempts = 4;
  // Set while an automatic retry is scheduled; absent once stopped or exhausted.
  optional string next_retry_at = 5;
  // An automatic retry waits until the Agent Runner that may still be
  // executing the failed run reconnects or reports it; stopping it is allowed.
  bool waiting_for_runner = 6;
}
message AgentPendingAsk {
  string ask_id = 1;
  repeated AgentQuestion questions = 2;
}
message AgentQuestion {
  string id = 1;
  string prompt = 2;
  bool allow_multiple = 3;
  repeated AgentQuestionOption options = 4;
}
message AgentQuestionOption {
  string id = 1;
  string label = 2;
}
message AgentPendingEnvironment {
  string request_id = 1;
  string reason = 2;
  repeated AgentEnvironmentVariable variables = 3;
}
message AgentEnvironmentVariable {
  string key = 1;
  string description = 2;
  bool secret = 3;
}

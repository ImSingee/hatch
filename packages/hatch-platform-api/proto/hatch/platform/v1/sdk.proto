syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";
import "hatch/platform/v1/file.proto";

service SdkService {
  rpc GetSdk(GetSdkRequest) returns (GetSdkResponse);
}

message GetSdkRequest {
  string kind = 1 [(buf.validate.field).string.in = "app"];
}

// Versions of the tools this platform builds sources with. A client that
// prepares a source locally runs the same versions.
message Tooling {
  string buf_version = 1;
  string protoc_gen_es_version = 2;
  // Node build toolchain. Empty on a platform that predates it.
  string typescript_version = 3;
  string esbuild_version = 4;
  string pnpm_version = 5;
  // Native (NSH) frontends. Empty on a platform that predates it.
  string nsh_version = 6;
  // Whether the platform has a dedicated Builder for deployments.
  bool builder_enabled = 7;
}

message GetSdkResponse {
  repeated File files = 1;
  optional Tooling tooling = 2;
}

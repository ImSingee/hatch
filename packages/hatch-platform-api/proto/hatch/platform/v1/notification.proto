syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

// Notification center: history, destinations, groups, routes and channels.
// Accepts user sessions, API keys and Agent Run credentials with the same
// authority; Run sends to a group or destination come from "Hatch Agent".
// Device registration requires the native login session that owns the device.
service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
  rpc RetryDelivery(RetryDeliveryRequest) returns (RetryDeliveryResponse);
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
  // Send a notification as a Channel (without its token, routed like a
  // Channel push) or from the caller straight to a group or destination. Run
  // credentials are rejected like every other method.
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  // Edit or recall any notification by its id, whatever sent it: members
  // are all equal. Apps and Channels change only their own through their
  // /update and /recall endpoints.
  rpc UpdateNotification(UpdateNotificationRequest) returns (UpdateNotificationResponse);
  rpc RecallNotification(RecallNotificationRequest) returns (RecallNotificationResponse);
  // Answer a notification's reply form as the calling user. A notification
  // takes one answer: a second one is rejected with CONFLICT.
  rpc RespondToNotification(RespondToNotificationRequest) returns (RespondToNotificationResponse);
  // Delete any notification and its delivery records from history. Copies
  // destinations already received stay there and nothing is sent; recall
  // first to remove it from phones.
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  // How far the caller has read the timeline, shared by all their devices:
  // the calling user, or the platform Agent for a Run (Runs have no user).
  // What a notification said before each edit, oldest first, and every
  // answer it took (one per round of its reply form).
  rpc ListNotificationRevisions(ListNotificationRevisionsRequest) returns (ListNotificationRevisionsResponse);
  rpc GetNotificationReadState(GetNotificationReadStateRequest) returns (GetNotificationReadStateResponse);
  // Move the caller's read position forward to one notification, or to the
  // newest. A position behind the current one changes nothing.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse);
  rpc ListNotificationSources(ListNotificationSourcesRequest) returns (ListNotificationSourcesResponse);
  rpc GetApnsStatus(GetApnsStatusRequest) returns (GetApnsStatusResponse);

  rpc ListDestinations(ListDestinationsRequest) returns (ListDestinationsResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc UpdateDestination(UpdateDestinationRequest) returns (UpdateDestinationResponse);
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse);
  rpc DeleteDestination(DeleteDestinationRequest) returns (DeleteDestinationResponse);

  // Session-only: the device is bound to the calling sign-in session.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  // Push turned off on the phone: disables the device but keeps its routes and
  // groups; RegisterDevice from the same session turns it back on.
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse);
  rpc GetCurrentDevice(GetCurrentDeviceRequest) returns (GetCurrentDeviceResponse);

  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse);
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);

  // Response routes: where answers to reply forms are sent.
  rpc ListResponseRoutes(ListResponseRoutesRequest) returns (ListResponseRoutesResponse);
  rpc CreateResponseRoute(CreateResponseRouteRequest) returns (CreateResponseRouteResponse);
  rpc UpdateResponseRoute(UpdateResponseRouteRequest) returns (UpdateResponseRouteResponse);
  rpc DeleteResponseRoute(DeleteResponseRouteRequest) returns (DeleteResponseRouteResponse);

  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc RotateChannelToken(RotateChannelTokenRequest) returns (RotateChannelTokenResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
}

// ---------------------------------------------------------------- history

message NotificationDeliveryCounts {
  uint32 pending = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
  // Recalled before reaching the destination; counts as finished.
  uint32 canceled = 4;
}

message NotificationSummary {
  string id = 1;
  // app | channel | platform | user
  string source_type = 2;
  optional string source_id = 3;
  string source_name = 4;
  string kind = 5;
  string kind_name = 6;
  string title = 7;
  optional string body = 8;
  optional string url = 9;
  // ISO-8601 timestamps.
  string occurred_at = 10;
  string created_at = 11;
  // unrouted | pending | delivered | partial | failed
  string status = 12;
  NotificationDeliveryCounts deliveries = 13;
  // Tapping the phone push opens url instead of the notification.
  bool auto_open_url = 14;
  // 1 for the original; every edit and the recall increment it.
  uint32 revision = 15;
  // ISO-8601; set when the source last edited the notification.
  optional string edited_at = 16;
  // ISO-8601; set when the source recalled the notification.
  optional string recalled_at = 17;
  // Form people answer once; absent when the notification asks nothing.
  NotificationReply reply = 18;
  // ISO-8601; set when someone answered the reply form.
  optional string responded_at = 19;
  // -2 lowest (history only, never pushed to phones), -1 low (quiet on
  // phones), 0 normal, 1 high (time-sensitive on phones). Never changes.
  int32 priority = 20;
  // ISO-8601; when the source last pushed or edited it, with an edit that
  // changed the content or asked to alert again. Answers and recalls leave it
  // unchanged. The order of ListNotifications with order "activity".
  string activity_at = 21;
  // The answer to the current round of the reply form, once given.
  NotificationResponse response = 22;
  // Which question reply is: 1 for the form it was sent with, one more for
  // each edit that replaced or removed it.
  uint32 reply_round = 23;
  // Status and one block the timeline shows; absent without one.
  NotificationCard card = 24;
}

// ---------------------------------------------------------------- replies

message NotificationReplyOption {
  string id = 1 [(buf.validate.field).string.max_len = 40];
  string label = 2 [(buf.validate.field).string.max_len = 100];
  // Buttons only: shown as a destructive action.
  bool destructive = 3;
}

// One question. Limits beyond the field lengths (option counts, which
// settings apply to which type, unique ids) are checked by the shared reply
// rules, so every sender is held to the same form.
message NotificationReplyField {
  // Lowercase letters, digits and "_", starting with a letter; unique.
  string id = 1 [(buf.validate.field).string.max_len = 40];
  // buttons | single | multiple | text. buttons is a single choice shown as
  // buttons (1-4 options); single and multiple take 2-50 options.
  string type = 2 [(buf.validate.field).string = {
    in: [
      "buttons",
      "single",
      "multiple",
      "text"
    ]
  }];
  string label = 3 [(buf.validate.field).string.max_len = 100];
  optional string description = 4 [(buf.validate.field).string.max_len = 300];
  // Unset defaults to true.
  optional bool required = 5;
  repeated NotificationReplyOption options = 6 [(buf.validate.field).repeated.max_items = 50];
  // multiple only; defaults to 1 and to the number of options.
  optional uint32 min_selected = 7;
  optional uint32 max_selected = 8;
  // text only.
  optional string placeholder = 9 [(buf.validate.field).string.max_len = 100];
  optional bool multiline = 10;
  // text only; defaults to 1000, at most 4000.
  optional uint32 max_length = 11;
}

// A reply form. Read APIs return it normalized, with every default set.
message NotificationReply {
  repeated NotificationReplyField fields = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
  // Defaults to "Submit".
  optional string submit_label = 2 [(buf.validate.field).string.max_len = 32];
}

message NotificationAnswerOptions {
  repeated string ids = 1 [(buf.validate.field).repeated.max_items = 50];
}

// The answer to one field: `value` is the option id of a buttons or single
// field or the text of a text field; `option_ids` lists the options chosen in
// a multiple field.
message NotificationAnswer {
  oneof answer {
    string value = 1 [(buf.validate.field).string.max_len = 4000];
    NotificationAnswerOptions option_ids = 2;
  }
}

message NotificationResponse {
  // Keyed by field id; unanswered optional fields are absent.
  map<string, NotificationAnswer> answers = 1;
  // Absent once the user was removed.
  optional string responded_by_user_id = 2;
  string responded_by_name = 3;
  // push | mobile | web | cli
  string via = 4;
  // Device that answered from the push itself.
  optional string destination_id = 5;
  // ISO-8601.
  string responded_at = 6;
  // The round of the reply form this answers: 1 for the form the
  // notification was sent with, one more for each new question an edit asked.
  uint32 round = 7;
}

message RespondToNotificationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  map<string, NotificationAnswer> answers = 2 [(buf.validate.field).map.max_pairs = 10];
  // Where the answer was given, recorded for the history: mobile (the phone
  // app) or cli. Defaults to cli. It never changes what the caller may do.
  optional string via = 3 [(buf.validate.field).string = {
    in: [
      "mobile",
      "cli"
    ]
  }];
  // The round of the reply form the answer was given on (the notification's
  // reply_round when it was read). When set and an edit has since asked a
  // new question, the answer fails with a conflict instead of answering the
  // new one. 0 or unset answers the current round.
  uint32 round = 4;
}
message RespondToNotificationResponse {
  NotificationResponse response = 1;
}

message NotificationDelivery {
  string id = 1;
  optional string destination_id = 2;
  // device | webhook | app, or agent for an answer queued in an Agent chat
  // (which has no destination_id)
  string destination_type = 3;
  string destination_name = 4;
  // pending | in_progress | succeeded | failed | canceled
  string status = 5;
  uint32 attempts = 6;
  optional string next_attempt_at = 7;
  optional string last_error = 8;
  optional uint32 http_status = 9;
  // Free-form string an App destination returned; never interpreted.
  optional string result = 10;
  repeated string route_ids = 11;
  optional string completed_at = 12;
  string created_at = 13;
  string updated_at = 14;
  // Notification revision this destination last received; unset when never.
  optional uint32 delivered_revision = 15;
}

message NotificationDetail {
  NotificationSummary summary = 1;
  // JSON object, serialized.
  optional string data_json = 2;
  optional string dedupe_key = 3;
  repeated NotificationDelivery deliveries = 4;
  // The answer to the reply form, once given.
  NotificationResponse response = 5;
  // Deliveries of the answer to response route destinations.
  repeated NotificationDelivery response_deliveries = 6;
}

message ListNotificationsRequest {
  optional string source_type = 1 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "platform",
      "user"
    ]
  }];
  optional string source_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  optional string kind = 3 [(buf.validate.field).string.max_len = 64];
  optional string status = 4 [(buf.validate.field).string = {
    in: [
      "unrouted",
      "pending",
      "delivered",
      "partial",
      "failed"
    ]
  }];
  optional string cursor = 5 [(buf.validate.field).string.max_len = 64];
  uint32 limit = 6 [(buf.validate.field).uint32.lte = 100];
  // awaiting: a reply form nobody answered (and not recalled);
  // answered: someone answered it.
  optional string reply_state = 7 [(buf.validate.field).string = {
    in: [
      "awaiting",
      "answered"
    ]
  }];
  // created (default): newest pushed first. activity: most recently pushed
  // or edited first, the timeline order. A cursor only continues the order
  // that produced it.
  optional string order = 8 [(buf.validate.field).string = {
    in: [
      "created",
      "activity"
    ]
  }];
}
message ListNotificationsResponse {
  repeated NotificationSummary notifications = 1;
  optional string next_cursor = 2;
}

message GetNotificationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message GetNotificationResponse {
  NotificationDetail notification = 1;
}

message RetryDeliveryRequest {
  string delivery_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RetryDeliveryResponse {}

message SendTestNotificationRequest {
  string destination_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message SendTestNotificationResponse {
  string notification_id = 1;
}

// Same fields and limits as the Channel push body, sent to exactly one of
// channel_id, group_id or destination_id.
message SendNotificationRequest {
  // As this Channel: its declared kinds, dedupe scope and routes apply.
  string channel_id = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Required with channel_id. For a group or destination it is a free label
  // and defaults to "message".
  string kind = 2 [
    (buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,63}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // At most 200 characters after trimming, checked by the shared Channel
  // push rules so both paths accept the same titles.
  string title = 3 [(buf.validate.field).string.min_len = 1];
  optional string body = 4 [(buf.validate.field).string.max_len = 4000];
  // Absolute URL a device can open: a web page, another app's scheme
  // (mailto:, slack://...) or a hatch:// deep link. javascript:, data:, blob:,
  // file: and about: are rejected.
  optional string url = 5 [(buf.validate.field).string.max_len = 2048];
  // JSON object, at most 32 KiB serialized.
  optional string data_json = 6 [(buf.validate.field).string.max_len = 65536];
  // Repeats return the first notification: per Channel for channel_id, per
  // sending user for a group or destination.
  optional string dedupe_key = 7 [(buf.validate.field).string.max_len = 200];
  // ISO-8601 timestamp; defaults to now.
  optional string occurred_at = 8 [(buf.validate.field).string.max_len = 64];
  // Tapping the phone push opens url instead of the notification. Unset
  // defaults to whether url is set; false keeps the notification page; true
  // requires url. With a reply form, unset defaults to false.
  optional bool auto_open_url = 9;
  // Form people answer once; answers go to response routes.
  NotificationReply reply = 12;
  // Status and one block the timeline shows; phones show title and body.
  NotificationCard card = 15;

  // From the sending user, never routed: the group's enabled members.
  string group_id = 10 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // From the sending user, never routed: one enabled device, webhook or App
  // destination.
  string destination_id = 11 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Pushover-style priority; unset means 0. -2 lowest: kept in history and
  // sent to webhook and App destinations, never pushed to phones. -1 low:
  // phones get it quietly (no sound, no banner). 0 normal. 1 high:
  // time-sensitive, shown on phones during Focus and Do Not Disturb.
  // Emergency priority 2 is not supported.
  optional int32 priority = 13 [(buf.validate.field).int32 = {
    gte: -2
    lte: 1
  }];

  option (buf.validate.message).cel = {
    id: "send_notification.recipient"
    message: "set exactly one of channel_id, group_id or destination_id"
    expression: "[this.channel_id, this.group_id, this.destination_id].filter(id, id != '').size() == 1"
  };
  option (buf.validate.message).cel = {
    id: "send_notification.channel_kind"
    message: "kind is required when sending to a channel"
    expression: "this.channel_id == '' || this.kind != ''"
  };
}
message SendNotificationResponse {
  string notification_id = 1;
  // True when dedupe_key matched an earlier notification in its scope.
  bool deduplicated = 2;
  // Deliveries queued by matching routes or to the group or destination; 0
  // for a duplicate.
  uint32 delivery_count = 3;
}

// Unset fields keep their value; an empty body, url or data_json clears it.
// Without auto_open_url, a newly added url opens on phone tap, a cleared one
// stops and a replaced one keeps the setting. Kind, dedupe key and
// occurred_at never change.
message UpdateNotificationRequest {
  // Was the sending Channel's id; any member may change any notification.
  reserved 1;
  reserved "channel_id";
  string id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string title = 3 [(buf.validate.field).string.max_len = 200];
  optional string body = 4 [(buf.validate.field).string.max_len = 4000];
  optional string url = 5 [(buf.validate.field).string.max_len = 2048];
  optional bool auto_open_url = 6;
  // JSON object, at most 32 KiB serialized.
  optional string data_json = 7 [(buf.validate.field).string.max_len = 65536];
  // Update without another phone alert. Unset/false alerts again, even when
  // content is unchanged. With no content fields, this repeats the alert.
  bool silent = 8;
  // Ask a new question: replaces the reply form and starts the next round,
  // which takes its own answer. The same form again changes nothing.
  NotificationReply reply = 9;
  // Remove the reply form (also starts the next round). Not with reply.
  bool clear_reply = 10;
  // Replace the card (the whole card). Not with clear_card.
  NotificationCard card = 11;
  // Remove the card.
  bool clear_card = 12;
}
message UpdateNotificationResponse {
  // 1 for the original; every edit and the recall increment it.
  uint32 revision = 1;
  // False when a silent edit left the content unchanged; nothing was sent.
  bool changed = 2;
}

message RecallNotificationRequest {
  // Was the sending Channel's id; any member may change any notification.
  reserved 1;
  reserved "channel_id";
  string id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RecallNotificationResponse {
  uint32 revision = 1;
  // False when it was already recalled; nothing was sent again.
  bool changed = 2;
}

message DeleteNotificationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteNotificationResponse {}

// ---------------------------------------------------------------- cards

message NotificationCardStatus {
  string label = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 24
  }];
  // neutral | info | success | warning | danger; empty means neutral.
  string tone = 2 [(buf.validate.field).string = {
    in: [
      "",
      "neutral",
      "info",
      "success",
      "warning",
      "danger"
    ]
  }];
}

// A bar filled to percent (0-100), with an optional value such as "3 / 14".
message NotificationCardProgress {
  string label = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  // Required; 0 is a valid value.
  optional double percent = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 100
  }];
  optional string value = 3 [(buf.validate.field).string.max_len = 24];
}

message NotificationCardStat {
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 24
  }];
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
}

// One to three figures side by side.
message NotificationCardStats {
  repeated NotificationCardStat items = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
  }];
}

// A comment someone made, such as a review note.
message NotificationCardQuote {
  string author = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  string text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  optional string location = 3 [(buf.validate.field).string.max_len = 80];
}

// What a notification shows in the timeline besides its title and body.
message NotificationCard {
  NotificationCardStatus status = 1;
  oneof block {
    NotificationCardProgress progress = 2;
    NotificationCardStats stats = 3;
    NotificationCardQuote quote = 4;
  }
}

message NotificationRevision {
  // The notification revision while this version was current.
  uint32 revision = 1;
  string title = 2;
  optional string body = 3;
  optional string url = 4;
  // JSON object.
  optional string data_json = 5;
  // The question it asked then; absent when it asked nothing.
  NotificationReply reply = 6;
  uint32 reply_round = 7;
  NotificationCard card = 10;
  // ISO-8601: when this version became current, and when an edit replaced it.
  string activity_at = 8;
  string replaced_at = 9;
}

message ListNotificationRevisionsRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message ListNotificationRevisionsResponse {
  repeated NotificationRevision revisions = 1;
  repeated NotificationResponse responses = 2;
}

message NotificationReadState {
  // The last notification read; absent before the reader read any.
  optional string read_through_id = 1;
  // ISO-8601 activity time of the read position.
  string read_through_at = 2;
  // Notifications after the position in timeline order, leaving out
  // recalled ones and the caller's own sends.
  uint32 unread_count = 3;
  // The oldest unread notification in timeline order.
  optional string first_unread_id = 4;
}

message GetNotificationReadStateRequest {}
message GetNotificationReadStateResponse {
  NotificationReadState state = 1;
}

message MarkNotificationsReadRequest {
  oneof through {
    option (buf.validate.oneof).required = true;
    // Everything up to and including this notification is read.
    string notification_id = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }];
    // Everything so far is read.
    bool latest = 2 [(buf.validate.field).bool.const = true];
  }
  // With notification_id: its activity_at in the version the caller read
  // (RFC 3339). An edit since then moves it later, and the edit and anything
  // that arrived in between stay unread. Empty uses its current activity_at.
  // Not allowed with latest.
  string activity_at = 3 [(buf.validate.field).string.max_len = 64];
}
message MarkNotificationsReadResponse {
  NotificationReadState state = 1;
}

message NotificationKind {
  string kind = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,63}$"];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
}

message NotificationAppSource {
  string id = 1;
  string slug = 2;
  string name = 3;
  repeated NotificationKind kinds = 4;
}

message NotificationChannelSource {
  string id = 1;
  string name = 2;
  repeated NotificationKind kinds = 3;
}

message ListNotificationSourcesRequest {}
message ListNotificationSourcesResponse {
  repeated NotificationAppSource apps = 1;
  repeated NotificationChannelSource channels = 2;
  // Kinds of retained notifications people sent straight to a group or
  // destination; free labels, so they come from history.
  repeated NotificationKind user_kinds = 3;
}

message GetApnsStatusRequest {}
message GetApnsStatusResponse {
  // builtin | environment
  string source = 1;
  optional string topic = 2;
  bool production = 3;
  bool sandbox = 4;
  optional string error = 5;
}

// ---------------------------------------------------------------- destinations

message NotificationDeviceInfo {
  string platform = 1;
  // sandbox | production
  string environment = 2;
  string user_id = 3;
  optional string user_name = 4;
  string session_id = 5;
}

message NotificationWebhookInfo {
  string url = 1;
}

message NotificationAppInfo {
  string app_id = 1;
  optional string slug = 2;
  // Whether the live deployment still declares notifications.destination.
  bool accepting = 3;
}

message NotificationDestination {
  string id = 1;
  // device | webhook | app
  string type = 2;
  string name = 3;
  bool enabled = 4;
  optional string last_error = 5;
  repeated string group_ids = 6;
  string created_at = 7;
  string updated_at = 8;
  NotificationDeviceInfo device = 9;
  NotificationWebhookInfo webhook = 10;
  NotificationAppInfo app = 11;
  // Receives edit and recall events. Always true for devices; set by the
  // manifest for Apps and by settings for webhooks.
  bool lifecycle_events = 12;
  // Response routes may send it answers: every webhook, and an App whose
  // manifest sets notifications.destination.responses. Never a device.
  bool accepts_responses = 13;
}

message ListDestinationsRequest {}
message ListDestinationsResponse {
  repeated NotificationDestination destinations = 1;
}

message CreateWebhookRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  string url = 2 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
  // Also POST hatch.notification.updated and hatch.notification.recalled.
  bool lifecycle_events = 3;
}
message CreateWebhookResponse {
  NotificationDestination destination = 1;
  // Shown once; used to verify x-hatch-signature on deliveries.
  string secret = 2;
}

message UpdateDestinationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional bool enabled = 3;
  optional string url = 4 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
  // Webhooks only.
  optional bool lifecycle_events = 5;
}
message UpdateDestinationResponse {
  NotificationDestination destination = 1;
}

message RotateWebhookSecretRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RotateWebhookSecretResponse {
  string secret = 1;
}

message DeleteDestinationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteDestinationResponse {}

message RegisterDeviceRequest {
  // Initial display name. An already registered device keeps its current
  // name; rename it with UpdateDestination.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  string platform = 2 [(buf.validate.field).string = {
    in: ["ios"]
  }];
  // Hex APNs device token.
  string apns_token = 3 [(buf.validate.field).string.pattern = "^[0-9a-fA-F]{16,200}$"];
  string apns_environment = 4 [(buf.validate.field).string = {
    in: [
      "sandbox",
      "production"
    ]
  }];
  // Identifies the end-to-end key on the device; echoed in each push.
  string e2e_key_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{8,64}$"];
  // 32-byte AES-256-GCM key, base64url without padding.
  string e2e_key = 6 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
}
message RegisterDeviceResponse {
  NotificationDestination destination = 1;
}

message UnregisterDeviceRequest {}
message UnregisterDeviceResponse {}

message GetCurrentDeviceRequest {}
message GetCurrentDeviceResponse {
  NotificationDestination destination = 1;
}

// ---------------------------------------------------------------- groups

message NotificationGroup {
  string id = 1;
  string name = 2;
  optional string description = 3;
  repeated string destination_ids = 4;
  string created_at = 5;
  string updated_at = 6;
  // Device destinations created later join this group automatically.
  bool auto_add_devices = 7;
}

message NotificationDestinationIds {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message ListGroupsRequest {}
message ListGroupsResponse {
  repeated NotificationGroup groups = 1;
}

message CreateGroupRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 2 [(buf.validate.field).string.max_len = 500];
  NotificationDestinationIds destination_ids = 3;
  // New device destinations join the group when they register. Existing
  // devices are not added. Defaults to false.
  optional bool auto_add_devices = 4;
}
message CreateGroupResponse {
  NotificationGroup group = 1;
}

message UpdateGroupRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
  // When present, replaces the full member list.
  NotificationDestinationIds destination_ids = 4;
  // Changes whether device destinations created from now on join the group.
  // Current members are unchanged.
  optional bool auto_add_devices = 5;
}
message UpdateGroupResponse {
  NotificationGroup group = 1;
}

message DeleteGroupRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteGroupResponse {}

// ---------------------------------------------------------------- routes

message NotificationRoute {
  string id = 1;
  optional string name = 2;
  // app | channel | any
  string source_type = 3;
  // Absent: any source of source_type.
  optional string source_id = 4;
  // Absent: any kind.
  optional string kind = 5;
  // group | destination
  string target_type = 6;
  string target_id = 7;
  bool enabled = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListRoutesRequest {}
message ListRoutesResponse {
  repeated NotificationRoute routes = 1;
}

message CreateRouteRequest {
  optional string name = 1 [(buf.validate.field).string.max_len = 80];
  string source_type = 2 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  optional string source_id = 3 [(buf.validate.field).string.max_len = 191];
  optional string kind = 4 [(buf.validate.field).string.max_len = 64];
  string target_type = 5 [(buf.validate.field).string = {
    in: [
      "group",
      "destination"
    ]
  }];
  string target_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 7;
}
message CreateRouteResponse {
  NotificationRoute route = 1;
}

message UpdateRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 80];
  optional string source_type = 3 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  // Empty string clears the source (any source of source_type).
  optional string source_id = 4 [(buf.validate.field).string.max_len = 191];
  // Empty string clears the kind (any kind).
  optional string kind = 5 [(buf.validate.field).string.max_len = 64];
  optional string target_type = 6 [(buf.validate.field).string = {
    in: [
      "group",
      "destination"
    ]
  }];
  optional string target_id = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 8;
}
message UpdateRouteResponse {
  NotificationRoute route = 1;
}

message DeleteRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteRouteResponse {}

// ---------------------------------------------------------------- response routes

// Answers to notifications matching (source, kind) go to one webhook, or to
// one App that accepts responses.
message NotificationResponseRoute {
  string id = 1;
  optional string name = 2;
  // app | channel | any
  string source_type = 3;
  // Absent: any source of source_type.
  optional string source_id = 4;
  // Absent: any kind.
  optional string kind = 5;
  // The webhook or App answers go to; absent for an agent target.
  optional string destination_id = 6;
  bool enabled = 7;
  string created_at = 8;
  string updated_at = 9;
  // destination: a webhook or App. agent: each answer becomes a message in an
  // Agent chat, which starts a run.
  string target_type = 10;
  // Agent target: the chat every answer goes to; absent for one chat per
  // notification (opened by its first answer, reused by later questions).
  optional string agent_session_id = 11;
  // Agent target: what the Agent should do with each answer.
  optional string agent_instructions = 12;
}

message ListResponseRoutesRequest {
  // Return routes created after this route id.
  optional string cursor = 1 [(buf.validate.field).string.max_len = 64];
  // Routes per page; 0 means 50.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 100];
}
message ListResponseRoutesResponse {
  repeated NotificationResponseRoute routes = 1;
  optional string next_cursor = 2;
}

message CreateResponseRouteRequest {
  optional string name = 1 [(buf.validate.field).string.max_len = 80];
  string source_type = 2 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  optional string source_id = 3 [(buf.validate.field).string.max_len = 191];
  optional string kind = 4 [(buf.validate.field).string.max_len = 64];
  // Send answers to this webhook or App. Set exactly one of destination_id
  // and agent.
  optional string destination_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 6;
  // Send answers to the Agent as a message in a chat.
  bool agent = 7;
  // With agent: the chat every answer goes to; unset for one chat per
  // notification.
  optional string agent_session_id = 8 [(buf.validate.field).string.max_len = 64];
  // With agent: what the Agent should do with each answer.
  optional string agent_instructions = 9 [(buf.validate.field).string.max_len = 2000];
}
message CreateResponseRouteResponse {
  NotificationResponseRoute route = 1;
}

message UpdateResponseRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 80];
  optional string source_type = 3 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  // Empty string clears the source (any source of source_type).
  optional string source_id = 4 [(buf.validate.field).string.max_len = 191];
  // Empty string clears the kind (any kind).
  optional string kind = 5 [(buf.validate.field).string.max_len = 64];
  // Send answers to this webhook or App instead. Not with agent.
  optional string destination_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 7;
  // Send answers to the Agent instead. Not with destination_id.
  bool agent = 8;
  // Agent target: the chat every answer goes to; empty string for one chat
  // per notification. Unset keeps the current chat.
  optional string agent_session_id = 9 [(buf.validate.field).string.max_len = 64];
  // Agent target: empty string removes them. Unset keeps them.
  optional string agent_instructions = 10 [(buf.validate.field).string.max_len = 2000];
}
message UpdateResponseRouteResponse {
  NotificationResponseRoute route = 1;
}

message DeleteResponseRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteResponseRouteResponse {}

// ---------------------------------------------------------------- channels

message NotificationChannel {
  string id = 1;
  string name = 2;
  optional string description = 3;
  repeated NotificationKind kinds = 4;
  bool enabled = 5;
  // POST target; authenticate with x-hatch-secret or ?secret=.
  string push_url = 6;
  string created_at = 7;
  string updated_at = 8;
}

message NotificationKindList {
  repeated NotificationKind kinds = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message ListChannelsRequest {}
message ListChannelsResponse {
  repeated NotificationChannel channels = 1;
}

message CreateChannelRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 2 [(buf.validate.field).string.max_len = 500];
  NotificationKindList kinds = 3 [(buf.validate.field).required = true];
}
message CreateChannelResponse {
  NotificationChannel channel = 1;
  // Shown once.
  string token = 2;
}

message UpdateChannelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
  // When present, replaces the full kind list.
  NotificationKindList kinds = 4;
  optional bool enabled = 5;
}
message UpdateChannelResponse {
  NotificationChannel channel = 1;
}

message RotateChannelTokenRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RotateChannelTokenResponse {
  string token = 1;
}

message DeleteChannelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteChannelResponse {}

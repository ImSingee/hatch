syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

// The models configured under the instance's providers, of every kind.
service ModelService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SetModelKind(SetModelKindRequest) returns (SetModelKindResponse);
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
}

message ProviderModel {
  // Model id taken by the update calls and, for image models, the
  // image-model calls.
  string id = 1;
  string provider_id = 2;
  string provider_name = 3;
  // Model id sent to the provider.
  string model_id = 4;
  string name = 5;
  // "chat" runs the Agent; "image" generates images.
  string kind = 6;
  string description = 7;
  bool enabled = 8;
  // Catalog entry supplying metadata ("<catalog provider>/<model id>").
  optional string catalog_ref = 9;
  // False when catalog_ref names an entry the catalog no longer has.
  bool in_catalog = 10;
  // Effective chat metadata; unset for image models.
  optional ChatModelSpec chat = 11;
}

message ChatModelSpec {
  bool reasoning = 1;
  // Thinking levels offered, in order; empty when the model does not reason.
  repeated string thinking_levels = 2;
  string default_thinking_level = 3;
  uint32 context_window = 4;
  uint32 max_tokens = 5;
  // Overrides that differ from the catalog: "reasoning", "context_window"
  // or "max_tokens".
  repeated string overridden = 6;
  // Stored overrides; unset follows the catalog.
  optional bool reasoning_override = 7;
  optional uint32 context_window_override = 8;
  optional uint32 max_tokens_override = 9;
}

message ListModelsRequest {
  // Only models of this kind; every kind when unset.
  optional string kind = 1 [(buf.validate.field).string = {
    in: [
      "chat",
      "image"
    ]
  }];
  // The next_cursor of the previous page.
  optional string cursor = 2 [(buf.validate.field).string.pattern = "^[0-9]{1,9}$"];
  // Models per page; 0 returns every model.
  uint32 limit = 3 [(buf.validate.field).uint32.lte = 100];
  // Only this provider's models.
  optional string provider_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  // Only enabled (true) or disabled (false) models.
  optional bool enabled = 5;
}

message ListModelsResponse {
  // Provider order, then each provider's model order.
  repeated ProviderModel models = 1;
  // Set when more models follow this page.
  optional string next_cursor = 2;
}

message SetModelKindRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  string kind = 2 [(buf.validate.field).string = {
    in: [
      "chat",
      "image"
    ]
  }];
}

message SetModelKindResponse {
  ProviderModel model = 1;
}

message CreateModelRequest {
  string provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  // "chat" (default) or "image".
  optional string kind = 2 [(buf.validate.field).string = {
    in: [
      "chat",
      "image"
    ]
  }];
  string model_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Defaults to the catalog name, then the model id.
  optional string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  optional string description = 5 [(buf.validate.field).string.max_len = 200];
  // Catalog entry to take metadata from; matched by model id when unset.
  optional string catalog_ref = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 300
  }];
  // Take no catalog metadata. Excludes catalog_ref.
  bool no_catalog = 7;
  optional bool reasoning = 8;
  optional uint32 context_window = 9 [(buf.validate.field).uint32.gt = 0];
  optional uint32 max_tokens = 10 [(buf.validate.field).uint32.gt = 0];
}

message CreateModelResponse {
  ProviderModel model = 1;
}

// Unset fields stay unchanged.
message UpdateModelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  optional string model_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  optional string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // An empty description clears it.
  optional string description = 4 [(buf.validate.field).string.max_len = 200];
  optional string catalog_ref = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 300
  }];
  // Detach the model from the catalog. Excludes catalog_ref.
  bool no_catalog = 6;
  optional bool reasoning = 7;
  optional uint32 context_window = 8 [(buf.validate.field).uint32.gt = 0];
  optional uint32 max_tokens = 9 [(buf.validate.field).uint32.gt = 0];
  // Overrides to clear so the catalog value applies again: "reasoning",
  // "context_window", "max_tokens". A field cannot be both set and reset.
  repeated string reset_fields = 10 [(buf.validate.field).repeated = {
    max_items: 3
    items: {
      string: {
        in: [
          "reasoning",
          "context_window",
          "max_tokens"
        ]
      }
    }
  }];
  optional bool enabled = 11;
}

message UpdateModelResponse {
  ProviderModel model = 1;
}

message DeleteModelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message DeleteModelResponse {}
